<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Status Server</title>
  <style>
    :root {
      --bg: #0d1020;
      --bg-glow-1: rgba(249, 115, 22, 0.16);
      --bg-glow-2: rgba(124, 58, 237, 0.18);
      --card: rgba(255, 255, 255, 0.05);
      --border: rgba(255, 255, 255, 0.10);
      --track: rgba(255, 255, 255, 0.08);
      --text: #f3f4f8;
      --muted: #9aa1b5;
      --accent: #f97316;
      --accent-2: #f43f5e;
      --ok: #22c55e;
      --bad: #ef4444;
      --radius: 20px;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f4f5fa;
        --bg-glow-1: rgba(249, 115, 22, 0.14);
        --bg-glow-2: rgba(124, 58, 237, 0.12);
        --card: rgba(255, 255, 255, 0.85);
        --border: rgba(20, 24, 40, 0.10);
        --track: rgba(20, 24, 40, 0.08);
        --text: #161a2b;
        --muted: #5d6479;
        --ok: #15803d;
        --bad: #b91c1c;
      }
    }

    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      background:
        radial-gradient(800px 480px at 10% 0%, var(--bg-glow-1), transparent 60%),
        radial-gradient(800px 480px at 100% 100%, var(--bg-glow-2), transparent 60%),
        var(--bg);
    }

    .card {
      width: min(400px, 100%);
      padding: 24px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.28);
    }

    /* Header: logo + nama + status */
    .head {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .logo {
      flex: none;
      width: 56px;
      height: 56px;
      border-radius: 16px;
      overflow: hidden;
      background: var(--track);
      display: grid;
      place-items: center;
      font-size: 1.6rem;
    }
    .logo img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .info { min-width: 0; }
    h1 {
      margin: 0 0 6px;
      font-size: 1.05rem;
      font-weight: 650;
      line-height: 1.25;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: .8rem;
      font-weight: 600;
      color: var(--muted);
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
    .pill.online  { color: var(--ok); }
    .pill.offline { color: var(--bad); }
    .pill.online .dot { animation: pulse 2s infinite; }

    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(34, 197, 94, .55); }
      70%  { box-shadow: 0 0 0 8px rgba(34, 197, 94, 0); }
      100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
    }

    /* Jumlah pemain */
    .count {
      margin-top: 28px;
      display: flex;
      align-items: baseline;
      gap: 8px;
      font-variant-numeric: tabular-nums;
    }
    .now {
      font-size: clamp(3.2rem, 15vw, 4.2rem);
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .max { font-size: 1.4rem; font-weight: 600; color: var(--muted); }
    .caption { margin: 6px 0 0; color: var(--muted); font-size: .9rem; }

    /* Bar slot */
    .bar {
      margin-top: 20px;
      height: 8px;
      border-radius: 999px;
      background: var(--track);
      overflow: hidden;
    }
    .bar > i {
      display: block;
      height: 100%;
      width: 0;
      min-width: 6px;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      transition: width .8s ease;
    }
    .meta {
      margin-top: 8px;
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: .8rem;
      font-variant-numeric: tabular-nums;
    }

    .updated {
      margin: 20px 0 0;
      padding-top: 14px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: .8rem;
    }

    @media (prefers-reduced-motion: reduce) {
      .pill.online .dot { animation: none; }
      .bar > i { transition: none; }
    }
  </style>
</head>
<body>
  <main class="card">
    <header class="head">
      <div class="logo">
        <img id="logo" alt="Logo server" hidden>
        <span id="fallback" aria-hidden="true"></span>
      </div>
      <div class="info">
        <h1 id="nama">Memuat…</h1>
        <span id="pill" class="pill"><span class="dot"></span><span id="pilltext">Menghubungkan</span></span>
      </div>
    </header>

    <div class="count" aria-live="polite">
      <span class="now" id="now">0</span>
      <span class="max">/ <span id="max">0</span></span>
    </div>
    <p class="caption">Pemain online</p>

    <div class="bar" role="progressbar" aria-label="Slot terisi" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="bar">
      <i id="fill"></i>
    </div>
    <div class="meta"><span id="persen">0%</span><span>Slot terisi</span></div>

    <p class="updated" id="updated">—</p>
  </main>

  <script>
    const POLL_MS = 3000; // data di-cache 15 dtk di server, jadi 10 dtk sudah cukup

    const $ = (id) => document.getElementById(id);
    let tampil = 0;
    let logoSudahDiset = false;

    // Hapus kode warna FiveM seperti ^1 ^2 ... dari nama server
    const bersihkan = (s) => String(s).replace(/\^\d/g, "").trim();

    // Animasi angka naik/turun
    function animasi(ke) {
      const dari = tampil, mulai = performance.now(), durasi = 700;
      tampil = ke;
      function langkah(t) {
        const p = Math.min((t - mulai) / durasi, 1);
        const e = 1 - Math.pow(1 - p, 3);
        $("now").textContent = Math.round(dari + (ke - dari) * e).toLocaleString("id-ID");
        if (p < 1) requestAnimationFrame(langkah);
      }
      requestAnimationFrame(langkah);
    }

    function setLogo(icon) {
      const img = $("logo");
      img.onload = () => { img.hidden = false; $("fallback").hidden = true; };
      img.onerror = () => { img.hidden = true; $("fallback").hidden = false; };
      // Tanpa icon dari server, pakai /logo.png (taruh di folder public/, opsional)
      img.src = icon ? "data:image/png;base64," + icon : "/logo.png";
    }

    async function muat() {
      try {
        const r = await fetch("/api/players");
        const d = await r.json();
        if (d.error) throw new Error(d.error);

        if (!logoSudahDiset) { setLogo(d.icon); logoSudahDiset = true; }

        const nama = bersihkan(d.name);
        $("nama").textContent = nama;
        document.title = `${d.online} online · ${nama}`;
        $("max").textContent = d.max.toLocaleString("id-ID");
        animasi(d.online);

        const persen = d.max ? Math.min((d.online / d.max) * 100, 100) : 0;
        $("fill").style.width = persen + "%";
        $("bar").setAttribute("aria-valuenow", Math.round(persen));
        $("persen").textContent = persen.toFixed(1) + "%";

        $("pill").className = "pill online";
        $("pilltext").textContent = "Online";
        $("updated").textContent = "Diperbarui " + new Date().toLocaleTimeString("id-ID");
      } catch (e) {
        $("pill").className = "pill offline";
        $("pilltext").textContent = "Tidak terhubung";
        $("updated").textContent = "Gagal memuat data, mencoba lagi…";
      }
    }

    muat();
    setInterval(muat, POLL_MS);
  </script>
</body>
</html>
